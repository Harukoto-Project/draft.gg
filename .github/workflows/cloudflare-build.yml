name: cloudflare-build

# Workers 向けのビルドが通ることを確認する。デプロイはしない。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # api は packages/ の dist を参照する
      - name: 共有パッケージをビルド
        run: pnpm --filter "./packages/*" build

      - name: api(Workers)のバンドルを確認
        run: pnpm --filter @draftgg/api exec wrangler deploy --dry-run --outdir dist-worker
