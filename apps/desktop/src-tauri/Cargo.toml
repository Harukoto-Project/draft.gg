[package]
name = "draftgg-desktop"
version = "0.0.0"
description = "Draft.GG のデスクトップアプリ"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]
members = ["crates/engine", "crates/snapshot", "crates/storage"]

[lib]
name = "draftgg_desktop_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
draftgg-engine = { path = "crates/engine" }
draftgg-snapshot = { path = "crates/snapshot" }
draftgg-storage = { path = "crates/storage" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-snap-layout = "1"
