[package]
name = "draftgg-desktop"
version = "0.0.0"
description = "Draft.GG のデスクトップアプリ"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]
members = ["crates/engine"]

[lib]
name = "draftgg_desktop_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-snap-layout = "1"
