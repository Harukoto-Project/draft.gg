[package]
name = "draftgg-storage"
version = "0.0.0"
description = "Draft.GG のユーザーデータ(プレイヤー・プール・チーム・保存ドラフト)のローカル保存(Tauri に依存しない)"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
draftgg-engine = { path = "../engine" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
