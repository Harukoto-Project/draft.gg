[package]
name = "draftgg-snapshot"
version = "0.0.0"
description = "Draft.GG の統計スナップショットの取得とローカルキャッシュ(Tauri に依存しない)"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
draftgg-engine = { path = "../engine" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
] }
