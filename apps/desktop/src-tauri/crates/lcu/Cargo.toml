[package]
name = "draftgg-lcu"
version = "0.0.0"
description = "LoL クライアント(LCU)のチャンピオンセレクトを監視し、ドラフト向けの形に整える(Tauri に依存しない)"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# LCU は自己署名証明書で応答するため、OS の TLS(native-tls)で証明書検証を切って loopback にだけ接続する
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
